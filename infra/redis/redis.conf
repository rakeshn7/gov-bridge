# Redis configuration for GIL prototype
# Persistence: AOF enabled for durability of retry queue items

# Network
bind 0.0.0.0
protected-mode no
port 6379

# Persistence (AOF)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no

# Memory policy: LRU eviction for cache keys, never evict queue keys
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128
