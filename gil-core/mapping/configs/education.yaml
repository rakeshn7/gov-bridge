system_name: education
protocol: rest
base_url: ${EDUCATION_API_URL:http://localhost:8000/mock/education}
timeout_seconds: 10

auth:
  type: bearer
  token_env: SERVICE_JWT_SECRET

endpoint: /records/{identifier}
method: GET

field_mappings:
  registration_no: edu_id
  highest_qualification: qualification
  board_university: institution
  passing_year: year
  cgpa: score
  scholarship_availed: scholarship
